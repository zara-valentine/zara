<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Zara ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{
  height:100vh;
  background:linear-gradient(135deg,#ff6f9f,#ff9dbb);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  overflow:hidden;
}
#password,#app{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
input{padding:14px;border-radius:12px;border:none;font-size:16px;text-align:center}
button{padding:14px 30px;border:none;border-radius:25px;font-size:16px}
#password button{margin-top:15px;background:#000;color:#fff}

#app{display:none;text-align:center;padding:20px}
.glow{font-size:34px;font-weight:bold;margin-bottom:10px;animation:glow 1.5s infinite alternate}
@keyframes glow{from{text-shadow:0 0 10px #fff}to{text-shadow:0 0 25px #ff4d88}}

.heading{font-size:18px;margin-bottom:15px}
.box{
  background:rgba(255,255,255,.25);
  padding:25px;
  border-radius:20px;
  min-height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  transition:.5s
}

.buttons{margin-top:25px;position:relative;height:60px}
#yes{background:#fff;color:#ff4d88;margin-right:20px}
#no{background:#000;color:#fff;position:absolute}

.dark{background:linear-gradient(135deg,#111,#000)}
.small{font-size:14px;margin-top:10px}
</style>
</head>

<body>

<div id="password">
  <h2>This is only for Zara 💖</h2>
  <input id="pass" placeholder="Password">
  <button onclick="unlock()">Enter</button>
</div>

<div id="app">
  <div class="glow">Zara ✨</div>
  <div class="heading">Before I ask you something… let me tell you why you matter 💕</div>
  <div class="box" id="box"></div>

  <div class="buttons" id="buttons" style="display:none">
    <button id="yes">YES ❤️</button>
    <button id="no">NO 😶</button>
  </div>
</div>

<audio id="song" src="song.mp3" loop></audio>

<script>
const compliments=[
"Because your smile feels like home 🏡",
"Because you make ordinary moments special ✨",
"Because Zara, you’re effortlessly beautiful 💖",
"Because your presence calms my chaos 🌸",
"Because you’re rare, not everyone shines like you 💎",
"Because I laugh more when you’re around 😄",
"Because you matter more than you know ❤️",
"Because life feels lighter with you 🌈",
"Because my heart chose you silently 💞",
"Because you’re you… and that’s enough 💘"
];

let i=0;
const box=document.getElementById("box");
const buttons=document.getElementById("buttons");

function unlock(){
  if(pass.value==="Zara"){
    password.style.display="none";
    app.style.display="flex";
    song.play();
    showCompliments();
  } else alert("Wrong password 😶");
}

function showCompliments(){
  box.innerText=compliments[i];
  const interval=setInterval(()=>{
    i++;
    if(i<compliments.length){
      box.innerText=compliments[i];
    }else{
      clearInterval(interval);
      setTimeout(showQuestion,2000);
    }
  },4000);
}

function showQuestion(){
  document.body.classList.add("dark");
  box.innerHTML="Will you be my Valentine? 💘<br><div class='small'>— Sandeep ❤️</div>";
  buttons.style.display="block";
}

no.addEventListener("mouseover",()=>{
  no.style.left=Math.random()*200+"px";
  no.style.top=Math.random()*50+"px";
});

yes.onclick=()=>{
  box.innerHTML="Zara ❤️<br><br>You just unlocked a secret… 💌";
  buttons.style.display="none";

  setTimeout(()=>{
    typeText("I don’t know when it happened… but my heart started choosing you. 🌹");
  },2000);

  setTimeout(()=>{
    box.innerHTML="💝 Valentine Date Card 💝<br><br>📅 14 Feb<br>📍 With Me<br><br><small>From Sandeep ❤️</small>";
  },9000);
}

function typeText(text){
  let j=0;box.innerHTML="";
  const t=setInterval(()=>{
    box.innerHTML+=text[j];
    j++;
    if(j===text.length)clearInterval(t);
  },80);
}
</script>

</body>
</html>
