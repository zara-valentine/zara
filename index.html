<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Zara ❤️</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="passwordScreen" class="screen">
  <h2>🔒 This moment is private</h2>
  <p>Enter the password to continue 💖</p>
  <input type="password" id="pass">
  <button onclick="unlock()">Unlock</button>
</div>

<div id="app" class="hidden">
  <h1 class="glow">Zara ✨</h1>
  <h2 id="intro">Before I ask you something… let me tell you why you matter 💕</h2>
  <div id="box" class="box"></div>
</div>

<div id="question" class="hidden screen">
  <h2>Will you be my Valentine? 💘</h2>
  <p>— Sandeep ❤️</p>
  <button id="yes">YES ❤️</button>
  <button id="no">NO 😶</button>
</div>

<div id="final" class="hidden screen pink">
  <h1 class="yesText">💖 She said YES 💖</h1>
  <p id="typing"></p>
  <div class="dateCard">
    <h3>💌 Valentine Date 💌</h3>
    <p>With: Zara</p>
    <p>From: Sandeep ❤️</p>
    <p>Time: Anytime you want</p>
    <p>Place: Wherever you smile 😊</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
