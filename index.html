<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zara ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="passwordScreen" class="screen">
  <h2>🔒 This moment is private</h2>
  <p>Enter the password to continue 💖</p>
  <input type="password" id="pass" placeholder="Password">
  <button onclick="unlock()">Unlock</button>
</div>

<!-- INTRO + COMPLIMENTS -->
<div id="intro" class="hidden">
  <h1 class="glow">Zara ✨</h1>
  <p class="subtitle">
    Before I ask you something… let me tell you why you matter 💕
  </p>

  <div id="app" class="box">
    <span id="boxText"></span>
  </div>
</div>

<!-- QUESTION -->
<div id="question" class="hidden">
  <div class="questionBox">
    <p>Will you be my Valentine? 💘</p>
    <span class="from">— Sandeep ❤️</span>
  </div>

  <div class="buttons">
    <button id="yes">YES ❤️</button>
    <button id="no">NO 😶</button>
  </div>
</div>

<!-- FINAL SCREEN -->
<div id="final" class="hidden">
  <h1>💖 She said YES 💖</h1>

  <p id="typing"></p>

  <div class="dateCard">
    <h3>💌 Valentine Date 💌</h3>
    <p><b>With:</b> Zara</p>
    <p><b>From:</b> Sandeep ❤️</p>
    <p><b>Time:</b> Anytime you want</p>
    <p><b>Place:</b> Wherever you smile 😊</p>
  </div>
</div>

<audio id="song" src="song.mp3" loop></audio>

<script src="script.js"></script>
</body>
</html>
